<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 620" role="img" aria-labelledby="map-title map-description"><title id="map-title">Eastern Vesalius regional disposition</title><desc id="map-description">Karsenne inland to the west; Caldrienne north of Veyrasse; Calvernis south; Ceralte offshore to the east. Serravonne lies on the Veyrasse coast. Cressault is disputed on the northern frontier.</desc><defs><pattern id="chart-grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#32514d" stroke-width="0.5"/></pattern><pattern id="disputed-hatch" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M-2 2L2-2M0 8L8 0M6 10L10 6" stroke="#e9c592" stroke-width="2"/></pattern></defs><rect width="540" height="620" fill="#091c20"/><rect width="540" height="620" fill="url(#chart-grid)"/><g stroke="#bbcab0" stroke-width="1.5" stroke-linejoin="round"><path d="M25 45 L180 45 177 140 204 204 191 282 208 358 182 442 192 534 25 554 Z" fill="#827653"/><path d="M180 45 L340 45 354 85 336 114 356 145 339 181 329 209 286 198 247 218 204 204 177 140 Z" fill="#77565a"/><path d="M204 204 L247 218 286 198 329 209 347 250 332 286 355 320 343 357 358 389 339 419 286 404 252 427 208 414 208 358 191 282 Z" fill="#44745e"/><path d="M208 414 L252 427 286 404 339 419 353 451 336 482 354 522 327 551 303 580 192 580 192 534 182 442 Z" fill="#496f7a"/><path d="M440 208 L456 194 472 216 460 249 442 240 Z M468 271 L487 253 499 274 489 306 472 301 Z M426 361 L441 348 456 370 445 397 425 385 Z M475 419 L490 404 503 425 495 449 480 447 Z" fill="#737099"/><path d="M210 200 L248 211 285 191 330 202 334 222 286 214 250 234 207 222 Z" fill="#cda16c"/><path d="M210 200 L248 211 285 191 330 202 334 222 286 214 250 234 207 222 Z" fill="url(#disputed-hatch)"/></g><g fill="#edf0db" font-family="Georgia,serif" font-size="17" text-anchor="middle"><text x="117" y="278">KARSENNE</text><text x="277" y="112">CALDRIENNE</text><text x="278" y="308">VEYRASSE</text><text x="281" y="496">CALVERNIS</text><text x="451" y="329">CERALTE</text><text x="276" y="237">CRESSAULT</text></g><g fill="#a6c7c4" font-family="monospace" font-size="12"><text x="386" y="120">COASTAL WATERS</text><text x="34" y="600">REGIONAL EXTRACT / NOT TO SCALE</text><text x="492" y="47">N</text><path d="M498 85V56M492 65L498 56 504 65" fill="none" stroke="#c2cda9" stroke-width="2"/></g><circle cx="344" cy="363" r="6" fill="#f3e5b8" stroke="#071b18" stroke-width="2"/><path d="M337 366L276 369" stroke="#f3e5b8"/><text x="276" y="383" fill="#fff0c7" font-family="monospace" font-size="14" text-anchor="middle">SERRAVONNE</text></svg>